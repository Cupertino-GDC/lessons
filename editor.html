<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">

    <meta name="description"
        content="Build a Game Dev Club lesson with a block editor and export a JSON object ready for data/lessons.json.">
    <meta name="robots" content="noindex,nofollow">
    <link rel="shortcut icon" href="imgs/GDCBrowserTabIcon.png">

    <link rel="stylesheet" href="css/primary.css">
    <link rel="stylesheet" href="css/lesson.css">
    <link rel="stylesheet" href="css/editor.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <title>Lesson Editor | GDC</title>
</head>

<body data-page="lessons">
    <a class="skip-link" href="#editor-main">Skip to editor</a>

    <div data-gdc-navbar></div>

    <header id="header" class="compact">
        <h1 id="title">Lesson Editor</h1>
        <h1 id="subtitle">Build a lesson, copy the object, commit it</h1>
    </header>

    <main id="editor-main" class="editor gdc-shell">
        <div data-lesson-editor>
            <noscript>
                <p class="editor-noscript">The lesson editor needs JavaScript enabled.</p>
            </noscript>
        </div>
    </main>

    <footer data-gdc-footer></footer>

    <div class="toast" data-toast role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <script src="js/primary.js"></script>
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/editor.js"></script>
</body>

</html>
